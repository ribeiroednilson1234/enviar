<h:body style="color: lightBlue">
	<h:header><h1>FORMULARIO DB_1</h1></h:header>
<h:caption>
	<h:h2>CADASTRO DE USUARIO LOCAL</h2>
   <h:form id="pdo.php">

<h:messages globalOnly="false" style="color:lightGray;" />

<h:panelGrid columns="5">

	<h:outputLabel for="nome" value="Nome:" /> 
	<h:inputText id="nome" value="#{usuarioBean.nome}" required="true" requiredMessage="Usuário do sistema" />
	<h:message for="nome" style="color:black;" />

	<h:outputLabel for="CPF" value="CPF:" /> 	
	<h:inputText id="CPF" value="#{usuarioBean.CPF}" required="true" requiredMessage="CPF do Usuário" />
	<h:message for="CPF" style="color:black;" />

	<h:outputLabel for="Endereço" value="Endereço:" /> 
	<h:inputText id="Endereço" value="#{usuarioBean.Endereço}" required="true" requiredMessage="Endereço do usuário" />
	<h:message for="Endereço" style="color:black;" />

	<h:outputLabel for="Correio_eletrônico" value="Correio_eletrônico:" /> 
	<h:inputText id="Correio_eletrônico" value="#{usuarioBean.Correio_eletrônico}" required="true" requiredMessage="E-mail do usuário do sistema" />
		<f:validateRegex pattern="[\w\.-]+@[\w\.-]+\.\w+" />
	</h:inputText>
	<h:message for="Correio_eletônico" style="color:cyan;" />
</h:panelGrid>

	<br />	
	
	<h:commandButton value="Salvar" action="#{usuarioBean.salvar}" />
	
   </h:form>
